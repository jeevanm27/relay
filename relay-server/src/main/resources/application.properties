spring.application.name=relay-server
server.port=${PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/relay}
spring.datasource.username=${DB_USER:relay}
spring.datasource.password=${DB_PASSWORD:relay}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.pool-name=relay-server

# The server owns schema migrations (workers never migrate). Flyway applies relay-core's db/migration.
spring.flyway.enabled=true

# RFC 9457 problem+json for framework errors (validation, bad JSON ...)
spring.mvc.problemdetails.enabled=true
# JDBC calls block; virtual threads keep that cheap without a tuned pool
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.service=relay-server

relay.retry-base-secs=${RELAY_RETRY_BASE_SECS:1}
relay.retry-cap-secs=${RELAY_RETRY_CAP_SECS:300}
relay.reaper-interval-ms=${RELAY_REAPER_INTERVAL_MS:5000}
relay.reaper-batch=${RELAY_REAPER_BATCH:500}
relay.gauge-interval-ms=${RELAY_GAUGE_INTERVAL_MS:5000}
