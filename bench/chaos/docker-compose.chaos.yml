# Compose project used by the chaos test and the benchmarks (project name: relaychaos).
# Workers are separate containers so that kill -9 / SIGSTOP-like pauses hit real, separate OS processes.
# Defaults can be overridden with environment variables, e.g. CHAOS_LEASE=10.
name: relaychaos

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    command: >
      postgres
      -c max_connections=300
      -c synchronous_commit=${PG_SYNC_COMMIT:-on}
      -c shared_buffers=${PG_SHARED_BUFFERS:-384MB}
      -c effective_cache_size=1GB
      -c wal_compression=on
      -c max_wal_size=2GB
      -c checkpoint_timeout=15min
      -c autovacuum_naptime=5s
      -c autovacuum_vacuum_scale_factor=0.02
      -c autovacuum_vacuum_cost_limit=2000
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  relay-server:
    image: relay/relay-server:dev
    build:
      context: ../..
      dockerfile: relay-server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/relay
      DB_USER: relay
      DB_PASSWORD: relay
      DB_POOL_SIZE: "10"
      RELAY_REAPER_INTERVAL_MS: "${CHAOS_REAPER_MS:-1000}"
      RELAY_GAUGE_INTERVAL_MS: "5000"
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    image: relay/relay-worker:dev
    build:
      context: ../..
      dockerfile: relay-worker/Dockerfile
    depends_on:
      relay-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/relay
      DB_USER: relay
      DB_PASSWORD: relay
      RELAY_QUEUE: "${RELAY_QUEUE:-chaos}"
      RELAY_CONCURRENCY: "${RELAY_CONCURRENCY:-16}"
      RELAY_POOL_SIZE: "${RELAY_POOL_SIZE:-8}"
      RELAY_CLAIM_BATCH: "${RELAY_CLAIM_BATCH:-10}"
      RELAY_LEASE_SECS: "${CHAOS_LEASE:-6}"
      RELAY_SHUTDOWN_GRACE_SECS: "5"
      RELAY_CHAOS: "${RELAY_CHAOS:-true}"
      CHAOS_SLOW_MS: "${CHAOS_SLOW_MS:-4000}"
      LOG_LEVEL: "${WORKER_LOG_LEVEL:-WARN}"
      JAVA_TOOL_OPTIONS: "-Xmx${WORKER_XMX:-140m}"
      RELAY_IDLE_MIN_MS: "${RELAY_IDLE_MIN_MS:-50}"
      RELAY_IDLE_MAX_MS: "${RELAY_IDLE_MAX_MS:-250}"
    mem_limit: ${WORKER_MEM:-300m}
    stop_grace_period: 15s

  # Optional: `docker compose --profile obs up -d` adds Prometheus + Grafana (http://localhost:3000) for the screen capture.
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ../../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay.json
    volumes:
      - ../../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
